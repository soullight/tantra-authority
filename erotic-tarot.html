  h += (qi===0 && q.h ? '<h1>'+q.h+'</h1>' : '<h2>'+q.h+'</h2>');
  if(q.sub) h += '<p class="sub">'+q.sub+'</p>';
  q.o.forEach((o,k)=>{ h+='<button class="opt" data-k="'+k+'">'+o.l+'</button>'; });
  const tot=L.length;
  h += '<div class="prog"><i style="width:'+Math.round((qi/tot)*100)+'%"></i></div><div class="pnum">'+(qi+1)+' of '+tot+'</div>';
  show(h, q.shadow);
  if(lvlIdx===0 && qi===0){ stage('qstart'); beacon('qstart'+Q1V, 'quiz:'+G); }
  [...document.querySelectorAll('.opt')].forEach(b=> b.onclick=()=>{
    const o=q.o[+b.dataset.k];
    if(lvlIdx===0 && qi<3 && o.v!=='-') arch[qi]=o.v;
    if(o.t) clauses[lvlIdx].push(o.t);
    qi++; if(qi<L.length) ask(); else result();
  });
}

function result(){
  const isL1=lvlIdx===0, isL3=lvlIdx===2;
  stage('qL'+(lvlIdx+1)+'done');
  saveProfile();   // persist this level's answers under PID → coach signup inherits them
  let h='';
  if(isL1){
    const key=arch.join(''); const a=ARCH[key]||ARCH.RBT;
    h += '<div class="rlvl">The card you drew · Erotic Tarot</div>';
    h += '<div class="card"><img src="'+BIO+'/cards/card-'+key+'.jpg" alt="'+a.n+'"><div class="cardname">'+a.n+'</div></div>';
    h += '<div class="read">'+a.r.split('|').map(p=>'<p>'+p+'</p>').join('')+'</div>';
  } else if(lvlIdx===1){
    h += '<div class="rlvl">Level 2 · Your psyche</div><div class="type" style="font-size:30px">How you\'re wired</div>';
    h += '<div class="read">';
    h += '<p>Here\'s what these answers actually reveal — and it\'s rarely the version you\'d say out loud. There are two of you running at once: one reaches openly for contact, and one keeps a quieter, more guarded room that almost no one is ever fully let into. You\'ve gotten good at running both at the same time — which is exactly why people find you hard to read all the way down.</p>';
    h += '<p>You feel things more precisely than you let on. You\'ve probably been called "intense," or "too much," somewhere along the way, and you learned to manage how much of yourself you show. But the truth underneath is that you\'ve been more careful with your wanting than you ever actually needed to be. There is a real appetite in you that has spent more time held back than expressed.</p>';
    h += '<p>And this is the part that lands: the desire you\'re slowest to name out loud is the one that would change the most the moment you did. That hesitation was never a flaw — it\'s a door you simply haven\'t walked through yet. Most people spend a whole life on the near side of it, mistaking the caution for who they are.</p>';
    h += '</div>';
  } else {
    h += '<div class="rlvl" style="color:var(--shadow)">Level 3 · Your shadow</div>';
    h += '<div class="card"><img src="'+BIO+'/cards/card-SHADOW.jpg" alt="The Gold in the Dark"><div class="cardname" style="color:var(--shadow)">The Gold in the Dark</div></div>';
    h += '<div class="read">';
    h += '<p>This is the layer almost no one lets themselves look at straight on — and the fact that you came this far says more about you than any single answer did. Here\'s the truth of the shadow: the desire you were most ashamed of wanting is almost always sitting right on top of your power. They were never two different things. The shame was only ever the lid.</p>';
    h += '<p>You\'ve shown the world a more acceptable version of your wanting than the real one. There\'s a charge in you that only comes out in the dark — or only in your own head, or maybe nowhere yet at all — a part of you the people closest to you have never actually met. That isn\'t deception. It\'s a self that\'s been waiting for a room safe enough to stand up in.</p>';
    h += '<p>And the desire you\'ve never said out loud — the one you maybe just admitted to a screen — does not make you broken, or too much, or wrong. It makes you alive. The dark in you was never damage to fix; it\'s unclaimed life force, asking at last to be met. The work isn\'t to get rid of it. The work is to stop abandoning it. Welcomed instead of buried, it stops running you from underneath — and becomes the most honest power you\'ve got.</p>';
    h += '</div>';
    h += '<a class="next" href="https://tantra-authority.com/test.html" style="text-decoration:none;border-color:var(--gold)">Go all the way → the full 100-question depth map<span class="s">your complete psychosexual chart · for the truly committed</span></a>';
  }
  const cl=clauses[lvlIdx].filter(Boolean);
  if(cl.length){ h += '<div class="you"><div class="h">'+(isL3?'What your shadow is telling you':'Especially true for you')+'</div><ul style="margin:0;padding:0">'+cl.map(x=>'<li>'+x+'</li>').join('')+'</ul></div>'; }

  // catalogue "dig deeper" recommendations — driven by their answers, each a tracked link
  const recs=deriveRecs();
  if(recs.length){
    h += '<div class="digg"><div class="dh">Others with your type went deeper here</div>';
    recs.forEach(r=> h += '<a class="rec" href="'+BIO+'/go?to='+r.p+'&src=rec:'+r.p+'">Others like you found <b>'+PROD[r.p]+'</b> helpful with '+r.th+' <span class="ar">→</span></a>');
    h += '<div style="text-align:center;margin-top:6px"><a class="small" href="https://tantra-authority.com/shop.html?src=quiz-rec" style="color:var(--gold)">See the whole library →</a></div></div>';
  }

  // go-deeper to the next level (free)
  if(lvlIdx<2){
    const nxt = lvlIdx===0 ? {t:'Go deeper → Level 2: your psyche', s:'6 taps · how you\'re wired underneath'} : {t:'Go deeper → Level 3: your shadow self', s:'7 taps · the disowned, the dark, the gold — if you answer openly'};
    h += '<button class="next" id="next">'+nxt.t+'<span class="s">'+nxt.s+'</span></button>';
  }
  // the offer command — soft at L1/L2, full at L3
  // ── the OFFER: lead with a cheap, instant, type-matched BUY (the dollar-one close); coach demoted to step two ──
  const hero=heroPick();
  // ── A/B SPLIT TEST — the DATA picks dollar one. A = $7 reading first · B = $29/mo coach (chat) first. ──
  const buyHref=BIO+'/go?to='+hero.p+'&src=buy:'+hero.p+':qv'+VAR+':L'+(lvlIdx+1)+':'+G+'&pid='+encodeURIComponent(PID);
  const coachHref=BIO+'/go?to=safetoletgo&src=coach:qv'+VAR+':L'+(lvlIdx+1)+':'+(arch.join('')||'-')+':'+G+'&pid='+encodeURIComponent(PID);
  const readBtn ='<a class="go" id="cta" href="'+buyHref+'">Your full reading → <b>'+hero.t+'</b> · instant · $'+hero.pr+'</a>';
  const coachBtn='<a class="go" id="cta" href="'+coachHref+'">Talk it through with your private coach · $29/mo</a>';
  const readAlt ='<a class="small" id="alt" href="'+buyHref+'">Or get your full reading now — instant · $'+hero.pr+' →</a>';
  const coachAlt='<a class="small" id="alt" href="'+coachHref+'">Or work with it ongoing — your private coach, any hour · $29/mo →</a>';
  h += '<div class="cmd"><p class="line">'+(isL3?CMD[VAR]:'This is your map. Here\'s where to begin tonight — for exactly who you are.')+'</p>';
  h += (VAR==='A' ? readBtn+coachAlt : coachBtn+readAlt) + '</div>';
  show(h, isL3);
  if(document.getElementById('next')) document.getElementById('next').onclick=()=>{
    if(lvlIdx===0 && !userEmail){ emailGate(); }   // free L1 card → email key-gate → deeper levels
    else { lvlIdx++; qi=0; ask(); }
  };
  document.getElementById('cta').addEventListener('click', ()=>{ beacon('qcta_'+QL, 'qv:'+VAR+':L'+(lvlIdx+1)); });
}
ask();
</script>
