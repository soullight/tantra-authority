<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment confirmed — Tantra Authority</title>
<meta name="robots" content="noindex">
<style>
  body{margin:0;background:#faf8f4;color:#1a1a1a;font-family:Georgia,serif;font-size:19px;line-height:1.6;}
  .wrap{max-width:560px;margin:0 auto;padding:60px 22px;text-align:center;}
  .logo{font-family:-apple-system,Segoe UI,Roboto,sans-serif;letter-spacing:.16em;font-weight:700;font-size:14px;text-decoration:none;color:#1a1a1a;}
  .logo span{color:#8b3a3a;}
  h1{font-size:1.9rem;margin:24px 0 12px;}
  .btn{display:inline-block;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-weight:700;text-decoration:none;background:#b8860b;color:#fff;padding:14px 26px;border-radius:11px;margin-top:14px;}
  .muted{color:#6b6b6b;font-family:-apple-system,Segoe UI,Roboto,sans-serif;font-size:.95rem;}
</style>
</head>
<body>
<div class="wrap">
  <a class="logo" href="/">TANTRA <span>AUTHORITY</span></a>
  <div id="out"><h1>Confirming your payment…</h1><p class="muted">One moment.</p></div>
</div>
<script>
const API = "https://api.tantra-authority.com";
const sid = new URLSearchParams(location.search).get("session_id");
const out = document.getElementById("out");
(async () => {
  if (!sid) { out.innerHTML = "<h1>Missing payment reference</h1><p class='muted'>Email hello@lawrencetheenergymaster.com and we'll sort it.</p>"; return; }
  try {
    const r = await fetch(API + "/api/stripe/confirm?session_id=" + encodeURIComponent(sid)).then(r => r.json());
    if (r.ok && r.accessUrl) {
      out.innerHTML = "<h1>You're in.</h1><p class='muted'>Payment confirmed.</p><a class='btn' href='" + r.accessUrl + "'>Open " + (r.title || "your purchase") + " →</a>";
    } else if (r.ok && r.kind === "session") {
      out.innerHTML = "<h1>Payment confirmed.</h1><p>Now pick your time.</p><a class='btn' href='/book-session.html'>Book your session →</a>";
    } else {
      out.innerHTML = "<h1>Payment received.</h1><p class='muted'>If you don't see your access shortly, use the <a href='/recover.html'>recovery form</a> with your email, or email hello@lawrencetheenergymaster.com.</p>";
    }
  } catch (e) {
    out.innerHTML = "<h1>Payment received.</h1><p class='muted'>Use the <a href='/recover.html'>recovery form</a> with your email to get your access.</p>";
  }
})();
</script>
</body>
</html>
