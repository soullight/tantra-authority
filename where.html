<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Where are you? — Session times</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root{ --bg:#0f0e12; --card:#1b1922; --text:#f4efe6; --muted:#9a9285; --gold:#e7c873; --line:#2c2935; --accent:#8b3a3a; }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif; padding:26px 18px 60px;}
  .wrap{max-width:560px; margin:0 auto;}
  h1{font-size:1.7rem; margin:6px 0 6px; text-align:center;}
  .sub{color:var(--muted); text-align:center; margin:0 auto 18px; max-width:26em; font-size:.98rem; line-height:1.5;}
  .now{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px 18px; text-align:center; margin:0 0 22px;}
  .now .lbl{color:var(--muted); font-size:.8rem; letter-spacing:.06em; text-transform:uppercase;}
  .now .val{font-size:1.25rem; font-weight:800; color:var(--gold); margin-top:4px;}
  .now .time{color:var(--muted); font-size:.92rem; margin-top:2px;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:11px;}
  button.z{display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:15px 16px; color:var(--text); cursor:pointer; transition:.12s;}
  button.z:active{transform:scale(.98);}
  button.z .flag{font-size:1.5rem; line-height:1;}
  button.z .city{font-weight:700; font-size:1.04rem; margin-top:5px;}
  button.z .t{color:var(--muted); font-size:.85rem;}
  button.z.active{border-color:var(--gold); background:#241f12;}
  button.z.active .city{color:var(--gold);}
  #toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--gold); color:#1a160f; font-weight:800; padding:13px 22px; border-radius:12px; transition:.2s; pointer-events:none;}
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .foot{color:var(--muted); font-size:.82rem; text-align:center; margin-top:24px; line-height:1.5;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Where are you right now?</h1>
  <p class="sub">Tap the country you're in. Your Tuesday/Thursday session times move with you. Your clients always see their own local time — so nobody ever books your 3 a.m.</p>

  <div class="now">
    <div class="lbl">Sessions currently run on</div>
    <div class="val" id="now-zone">…</div>
    <div class="time" id="now-time"></div>
  </div>

  <div class="grid" id="grid"></div>

  <p class="foot">Bookmark this page. One tap whenever you land somewhere new — that's the whole job.</p>
</div>
<div id="toast"></div>

<script>
const API = "https://api.tantra-authority.com";
const KEY = "lanoff_tz_7Qx29";
const ZONES = [
  { flag:"🇺🇸", city:"Los Angeles", tz:"America/Los_Angeles" },
  { flag:"🇺🇸", city:"New York", tz:"America/New_York" },
  { flag:"🇲🇽", city:"Mexico City", tz:"America/Mexico_City" },
  { flag:"🇨🇷", city:"Costa Rica", tz:"America/Costa_Rica" },
  { flag:"🇨🇴", city:"Colombia", tz:"America/Bogota" },
  { flag:"🇧🇷", city:"Brazil", tz:"America/Sao_Paulo" },
  { flag:"🇬🇧", city:"London", tz:"Europe/London" },
  { flag:"🇵🇹", city:"Lisbon", tz:"Europe/Lisbon" },
  { flag:"🇪🇺", city:"Paris / Berlin", tz:"Europe/Paris" },
  { flag:"🇬🇷", city:"Athens", tz:"Europe/Athens" },
  { flag:"🇦🇪", city:"Dubai", tz:"Asia/Dubai" },
  { flag:"🇮🇳", city:"India", tz:"Asia/Kolkata" },
  { flag:"🇹🇭", city:"Thailand", tz:"Asia/Bangkok" },
  { flag:"🇮🇩", city:"Bali", tz:"Asia/Makassar" },
  { flag:"🇯🇵", city:"Japan", tz:"Asia/Tokyo" },
  { flag:"🇦🇺", city:"Sydney", tz:"Australia/Sydney" },
];
let current = "America/Los_Angeles";

function timeIn(tz){ try { return new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit"}).format(new Date()); } catch(e){ return ""; } }
function labelIn(tz){ return (tz||"").split("/").pop().replace(/_/g," "); }

function render(){
  document.getElementById("now-zone").textContent = labelIn(current);
  document.getElementById("now-time").textContent = "Right now it's " + timeIn(current) + " there";
  const g = document.getElementById("grid"); g.innerHTML = "";
  ZONES.forEach(z => {
    const b = document.createElement("button");
    b.className = "z" + (z.tz === current ? " active" : "");
    b.innerHTML = '<span class="flag">'+z.flag+'</span><span class="city">'+z.city+'</span><span class="t">now '+timeIn(z.tz)+'</span>';
    b.addEventListener("click", () => setZone(z));
    g.appendChild(b);
  });
}

async function setZone(z){
  const prev = current; current = z.tz; render();
  try {
    const r = await fetch(API + "/api/session/tz?key=" + encodeURIComponent(KEY), {
      method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ tz: z.tz, key: KEY })
    }).then(r => r.json());
    if (!r.ok) { current = prev; render(); toast("Couldn't switch — try again"); return; }
    toast("✓ Now on " + z.city + " time");
  } catch(e){ current = prev; render(); toast("No connection — try again"); }
}

let toastT;
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove("show"), 2200);
}

(async function init(){
  try { const r = await fetch(API + "/api/session/tz").then(r=>r.json()); if (r && r.tz) current = r.tz; } catch(e){}
  render();
  setInterval(()=>{ document.getElementById("now-time").textContent = "Right now it's " + timeIn(current) + " there"; }, 30000);
})();
</script>
</body>
</html>
