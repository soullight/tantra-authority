<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recover your access — Tantra Authority</title>
<meta name="robots" content="noindex">
<style>
  :root { --accent:#8b3a3a; --bg:#faf8f5; --text:#2a2522; --muted:#6b6258; --border:#e6ddd2; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:Georgia,'Times New Roman',serif; line-height:1.6; }
  .wrap { max-width:560px; margin:0 auto; padding:64px 24px; }
  .eyebrow { font-family:Arial,sans-serif; font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--accent); font-weight:700; margin-bottom:14px; }
  h1 { font-size:28px; font-weight:600; margin:0 0 12px; line-height:1.25; }
  p.lede { color:var(--muted); margin:0 0 28px; }
  label { display:block; font-family:Arial,sans-serif; font-size:13px; font-weight:600; margin:0 0 6px; }
  input[type=email] { width:100%; padding:13px 14px; border:1px solid var(--border); border-radius:6px; font-size:16px; font-family:inherit; background:#fff; }
  button { margin-top:16px; background:var(--accent); color:#fff; border:none; font-family:Arial,sans-serif; font-size:15px; font-weight:600; padding:13px 26px; border-radius:6px; cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #result { margin-top:26px; padding:20px 22px; border-radius:8px; display:none; font-size:16px; }
  #result.ok { background:rgba(139,58,58,.06); border:1px solid var(--accent); }
  #result.info { background:#fff; border:1px solid var(--border); }
  #result a.btn { display:inline-block; margin-top:12px; background:var(--accent); color:#fff; text-decoration:none; font-family:Arial,sans-serif; font-size:15px; font-weight:600; padding:12px 24px; border-radius:6px; }
  a.home { color:var(--accent); font-family:Arial,sans-serif; font-size:15px; text-decoration:none; }
  .foot { margin-top:44px; font-family:Arial,sans-serif; font-size:12px; color:#9a8f82; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Tantra Authority</div>
  <h1>Recover your access</h1>
  <p class="lede">Lost the link to something you bought? Enter the email you used at checkout and we'll bring your access right back.</p>

  <form id="recover-form">
    <label for="email">Your purchase email</label>
    <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
    <button type="submit" id="submit-btn">Find my access</button>
  </form>

  <div id="result"></div>

  <p style="margin-top:32px;"><a class="home" href="/">&larr; Back to Tantra Authority</a></p>
  <div class="foot">Still stuck? Email <a href="mailto:hello@thenaked.press" style="color:#9a8f82;">hello@thenaked.press</a> and we'll sort it out personally.</div>
</div>

<script>
const API = "https://api.tantra-authority.com/api/recover";
const form = document.getElementById('recover-form');
const btn = document.getElementById('submit-btn');
const result = document.getElementById('result');

function show(cls, html) {
  result.className = cls;
  result.innerHTML = html;
  result.style.display = 'block';
  result.scrollIntoView({ behavior:'smooth', block:'center' });
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  btn.disabled = true;
  btn.textContent = 'Looking…';
  try {
    const res = await fetch(API, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (data.ok && data.found) {
      show('ok', '<strong>Found it.</strong> Your access to <em>' +
        (data.title ? String(data.title).replace(/[<>&]/g,'') : 'your purchase') +
        '</em> is ready:<br><a class="btn" href="' + data.link + '">Open my access &rarr;</a>' +
        '<br><span style="font-size:13px;color:#6b6258;display:block;margin-top:12px;">Bookmark that link — it\'s your way back in for a full year.</span>');
    } else if (data.ok && !data.found) {
      show('info', "We couldn't find an active purchase under that email. Double-check the address you used at checkout — or email <a href=\"mailto:hello@thenaked.press\" style=\"color:#8b3a3a;\">hello@thenaked.press</a> and we'll find it for you personally.");
    } else {
      show('info', "That email didn't look right. Re-enter it and try again, or email <a href=\"mailto:hello@thenaked.press\" style=\"color:#8b3a3a;\">hello@thenaked.press</a>.");
    }
  } catch (err) {
    show('info', "Something went wrong on our end. Please email <a href=\"mailto:hello@thenaked.press\" style=\"color:#8b3a3a;\">hello@thenaked.press</a> with your purchase email and we'll get your access to you right away.");
  }
  btn.disabled = false;
  btn.textContent = 'Find my access';
});
</script>
</body>
</html>
