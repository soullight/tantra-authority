# Static deploy to GitHub Pages via Actions.
# Added 2026-07-02 (SEO loop 006): the legacy Jekyll-based Pages builder began failing
# every build with an opaque "Page build failed." — this workflow bypasses it entirely
# and publishes the repo as-is. Revert by deleting this file and setting the Pages
# build_type back to "legacy".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
