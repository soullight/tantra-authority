<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Course — Tantra Authority</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  .access-wrap { max-width: 720px; margin: 0 auto; padding: 26px 22px 110px; }

  /* hero */
  .course-hero { text-align: center; padding: 22px 0 22px; }
  .emblem-img { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; object-position: center 14%;
    margin: 0 auto 22px; display: block; box-shadow: 0 12px 34px rgba(139,58,58,.34); border: 2px solid var(--gold); }
  .course-emblem { width: 70px; height: 70px; margin: 0 auto 20px; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, var(--gold), var(--accent) 78%); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 32px; }
  .course-title { font-family: 'Charter', Georgia, serif; font-size: 48px; line-height: 1.06; margin: 4px 0 16px; }
  .course-welcome { font-family: 'Inter', sans-serif; font-size: 16.5px; line-height: 1.7; color: var(--text-muted); max-width: 560px; margin: 0 auto; }
  .course-stats { font-family: 'Inter', sans-serif; font-size: 12.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold); margin-top: 20px; font-weight: 700; }
  .course-live { font-family: 'Charter', serif; font-style: italic; font-size: 15.5px; color: var(--text); max-width: 540px;
    margin: 22px auto 0; padding-top: 20px; border-top: 1px solid var(--border); }

  /* save bar — slim, with an obvious copy button */
  .save-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    background: linear-gradient(180deg, rgba(184,134,11,0.08), rgba(139,58,58,0.04));
    border: 1px solid var(--accent-soft); border-radius: 12px; padding: 12px 16px; margin: 34px 0 10px;
    font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-muted); }
  .save-bar b { color: var(--accent); }
  .save-bar input { flex: 1; min-width: 180px; background: #fff; border: 1px solid var(--border); border-radius: 7px; padding: 8px 10px; font: inherit; font-size: 11.5px; color: var(--text-muted); }
  .copy-btn { background: var(--accent); color: #fff; border: none; border-radius: 7px; padding: 9px 18px; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .copy-btn:hover { background: var(--gold); }

  .group-head { font-family: 'Charter', serif; font-size: 22px; margin: 40px 0 3px; display: flex; align-items: baseline; gap: 10px; }
  .group-head::before { content: ""; flex: none; width: 22px; height: 2px; background: var(--gold); transform: translateY(-6px); }
  .group-note { font-family: 'Inter', sans-serif; color: var(--text-muted); font-size: 13.5px; margin: 0 0 8px; }

  /* single column — each experience reads like its own piece, scroll down */
  .ep-list { margin: 0; }
  .ep { display: grid; grid-template-columns: 138px 1fr; gap: 24px; align-items: center; padding: 26px 0; border-bottom: 1px solid var(--border); }
  .ep:last-child { border-bottom: none; }
  .ep-art { position: relative; width: 138px; aspect-ratio: 1 / 1; border-radius: 15px; overflow: hidden; cursor: pointer;
    box-shadow: 0 9px 24px rgba(40,20,20,.24); border: 1px solid rgba(217,178,94,.30); }
  .ep-art .cover-svg { width: 100%; height: 100%; display: block; transition: transform .5s ease; }
  .ep-art:hover .cover-svg { transform: scale(1.07); }
  .ep-play { position: absolute; inset: 0; margin: auto; width: 48px; height: 48px; border-radius: 50%;
    background: rgba(18,10,10,.44); color: #f6e6c2; border: 1px solid rgba(246,230,194,.55); font-size: 14px;
    display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .25s; backdrop-filter: blur(2px); }
  .ep-art:hover .ep-play, .ep.playing .ep-play { opacity: 1; }
  .ep-num { font-family: 'Inter', sans-serif; font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase; color: var(--gold); font-weight: 700; }
  .ep-title { font-family: 'Charter', serif; font-size: 22px; line-height: 1.24; margin: 4px 0 0; }
  .ep audio { width: 100%; height: 36px; margin-top: 13px; }
  .ep-dl { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 600; color: var(--accent); text-decoration: none; margin-top: 9px; display: inline-block; }
  .ep-dl:hover { color: var(--gold); }

  .doc-list { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 4px 20px; }
  .doc-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--border); }
  .doc-row:last-child { border-bottom: none; }
  .doc-row .nm { font-family: 'Charter', serif; font-size: 15.5px; }
  .doc-row a { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; border: 1px solid var(--accent-soft); border-radius: 7px; padding: 6px 12px; white-space: nowrap; }

  .course-foot { text-align: center; font-family: 'Inter', sans-serif; font-size: 13px; color: var(--text-muted); margin-top: 56px; padding-top: 26px; border-top: 1px solid var(--border); }
  .course-foot a { color: var(--accent); }

  .state-msg { font-family: 'Inter', sans-serif; font-size: 16px; color: var(--text-muted); text-align: center; padding: 70px 0; }
  .recover-form { max-width: 380px; margin: 18px auto 0; display: flex; gap: 8px; }
  .recover-form input { flex: 1; background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 11px 13px; font: inherit; font-size: 14px; }
  .recover-form button { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 11px 18px; font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
  .recover-result { font-family: 'Inter', sans-serif; font-size: 14px; margin-top: 14px; }

  @media (max-width: 560px) {
    .course-title { font-size: 36px; }
    .ep { grid-template-columns: 96px 1fr; gap: 15px; }
    .ep-art { width: 96px; } .ep-title { font-size: 18px; }
    .recover-form { flex-direction: column; }
  }
</style>
<meta property="og:image" content="https://tantra-authority.com/assets/og-default.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:image" content="https://tantra-authority.com/assets/og-default.png">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<header class="site-header">
  <div class="site-header-inner"><a href="index.html" class="site-logo">TANTRA <span>AUTHORITY</span></a></div>
</header>

<div class="access-wrap"><div id="root"><div class="state-msg">Opening your course…</div></div></div>

<footer class="site-footer"><div>Tantra Authority — published by <a href="https://thenaked.press">The Naked Press</a></div></footer>

<script>
const API = "https://api.tantra-authority.com";
const token = new URLSearchParams(location.search).get("token");
const root = document.getElementById("root");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function pretty(raw) {
  let s = String(raw).split("/").pop().replace(/\.[a-z0-9]{1,5}$/i, "");
  s = s.replace(/\b\d{1,2}[-./]\d{1,2}[-./]\d{2,4}\b.*$/, "");
  s = s.replace(/[,\s]+\d{1,2}[.:]\d{2}\s*(am|pm)?$/i, "");
  s = s.replace(/^[\s\-_.]*\d+[\s\-_.]+/, "");
  s = s.replace(/[_+]+/g, " ").replace(/\s{2,}/g, " ").trim();
  if (s.length < 2) s = String(raw).split("/").pop().replace(/\.[a-z0-9]{1,5}$/i, "").replace(/[_+]+/g, " ").trim();
  if (s === s.toLowerCase() || s === s.toUpperCase()) s = s.replace(/\w\S*/g, (w) => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
  return s;
}
const pad2 = (n) => String(n).padStart(2, "0");
// Sub-MB files are real (e.g. 0.4 MB PDFs) — show KB so they never read as "0 MB".
function fmtSize(mb) { if (!mb) return ""; if (mb < 1) return Math.round(mb * 1000) + " KB"; if (mb < 10) return mb.toFixed(1) + " MB"; return Math.round(mb) + " MB"; }

// ── symbolic cover: a deterministic sacred-geometry mandala per experience ──
function _hash(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function _rng(seed){ let t=seed>>>0; return ()=>{ t=(t+0x6D2B79F5)>>>0; let r=Math.imul(t^t>>>15,1|t); r=(r+Math.imul(r^r>>>7,61|r))^r; return ((r^r>>>14)>>>0)/4294967296; }; }
// Klimt gold mandala — gold-on-midnight, mosaic tesserae, ornamental. Unique per experience.
function symbolicCover(name, i){
  const rnd=_rng((_hash(name)+i*2654435761)>>>0);
  const bgHue=220+Math.floor(rnd()*40);                       // indigo/violet midnight only
  const g1=`hsl(${bgHue} 44% ${10+Math.floor(rnd()*5)}%)`, g2=`hsl(${bgHue+12} 58% 4%)`;
  const GOLD="#d9b25e", HI="#f4d691", DK="#a9822f";
  const petals=8+2*Math.floor(rnd()*5); const rot=(rnd()*40).toFixed(1);
  // ornamental gold petals, faint gold fill = mosaic body
  let petalSvg=""; for(let k=0;k<petals;k++){ const a=(360/petals)*k+ +rot;
    petalSvg+=`<path d="M50 50 C 56 30, 56 18, 50 9 C 44 18, 44 30, 50 50 Z" transform="rotate(${a} 50 50)" fill="${GOLD}" fill-opacity="0.06" stroke="${GOLD}" stroke-width="0.6" opacity="0.82"/>`; }
  // star polygon
  const N=petals, M=Math.max(2,Math.floor(N/2)-(rnd()<.5?0:1)); let pts=[];
  for(let k=0;k<N;k++){ const a=2*Math.PI*k*M/N - Math.PI/2 + (+rot)*Math.PI/180; pts.push((50+28*Math.cos(a)).toFixed(1)+","+(50+28*Math.sin(a)).toFixed(1)); }
  // mosaic tesserae rings (Klimt) at seed-varied density
  const ring=(r,n,rad,col,op)=>{ let s=""; for(let k=0;k<n;k++){ const a=2*Math.PI*k/n; s+=`<circle cx="${(50+r*Math.cos(a)).toFixed(1)}" cy="${(50+r*Math.sin(a)).toFixed(1)}" r="${rad}" fill="${col}" opacity="${op}"/>`;} return s; };
  const dots=ring(46.5,64,0.4,DK,0.5)+ring(43,40+Math.floor(rnd()*16),0.7,GOLD,0.6)+ring(37,28+Math.floor(rnd()*12),0.5,HI,0.4);
  const rings=[44,40,33].map((r,j)=>`<circle cx="50" cy="50" r="${r}" fill="none" stroke="${j===1?HI:GOLD}" stroke-width="${j===0?0.5:0.4}" opacity="${(0.5-j*0.08).toFixed(2)}"/>`).join("");
  let specks=""; const SP=10+Math.floor(rnd()*8);
  for(let k=0;k<SP;k++){ const a=rnd()*6.283, r=12+rnd()*22; specks+=`<circle cx="${(50+r*Math.cos(a)).toFixed(1)}" cy="${(50+r*Math.sin(a)).toFixed(1)}" r="${(0.4+rnd()*0.5).toFixed(2)}" fill="${HI}" opacity="0.5"/>`; }
  return `<svg viewBox="0 0 100 100" class="cover-svg" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="cg${i}" cx="50%" cy="42%" r="70%"><stop offset="0%" stop-color="${g1}"/><stop offset="100%" stop-color="${g2}"/></radialGradient>
      <radialGradient id="cc${i}" cx="50%" cy="46%" r="55%"><stop offset="0%" stop-color="${HI}"/><stop offset="60%" stop-color="${GOLD}"/><stop offset="100%" stop-color="${DK}"/></radialGradient>
    </defs>
    <rect width="100" height="100" fill="url(#cg${i})"/>
    ${rings}${dots}${specks}
    <polygon points="${pts.join(" ")}" fill="none" stroke="${GOLD}" stroke-width="0.5" opacity="0.65"/>${petalSvg}
    <circle cx="50" cy="50" r="6" fill="url(#cc${i})"/><circle cx="50" cy="50" r="6" fill="none" stroke="${HI}" stroke-width="0.5" opacity="0.9"/><circle cx="50" cy="50" r="2" fill="${g2}"/>
  </svg>`;
}

function recoverBlock(intro) {
  return `<div class="recover"><p>${intro}</p>
    <form class="recover-form" id="recover-form"><input type="email" id="recover-email" placeholder="you@example.com" autocomplete="email" required><button type="submit">Get my link</button></form>
    <div class="recover-result" id="recover-result"></div></div>`;
}
function wireRecover() {
  const form = document.getElementById("recover-form"); if (!form) return;
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const out = document.getElementById("recover-result");
    out.textContent = "Looking…";
    try {
      const r = await fetch(API + "/api/recover", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ email: document.getElementById("recover-email").value.trim() }) });
      const d = await r.json();
      out.innerHTML = (d.ok && d.found) ? `Found your <strong>${esc(d.title)}</strong>. <a href="${esc(d.link)}">Open it →</a>` : "No purchase found for that email. Check the address, or reach support.";
    } catch { out.textContent = "Something went wrong — try again."; }
  });
}

let COURSE_TILES = null;   // per-course themed episode tiles (else procedural gold mandala)
const NOUN = (data) => /chakra|meditation|breath/i.test(data.title || "") ? "meditation" : "session";
function epRow(f, i) {
  const meta = fmtSize(f.sizeMB);
  const player = f.type === "video"
    ? `<video controls preload="none" playsinline src="${esc(f.url)}" style="width:100%;border-radius:9px;margin-top:13px;background:#000;max-height:62vh"></video>`
    : `<audio controls preload="none" src="${esc(f.url)}"></audio>`;
  const vidLabel = f.audioUrl ? "↓ Video" : "↓ Download";
  const audioDl = f.audioUrl
    ? ` &nbsp;·&nbsp; <a class="ep-dl" href="${esc(f.audioUrl)}" download>♪ Audio${f.audioSizeMB ? " · " + fmtSize(f.audioSizeMB) : ""}</a>`
    : "";
  const art = (COURSE_TILES && COURSE_TILES.length)
    ? `<img class="cover-svg" src="${esc(COURSE_TILES[i % COURSE_TILES.length])}" alt="" loading="lazy">`
    : symbolicCover(f.name, i);
  return `<div class="ep" data-type="${f.type}">
    <div class="ep-art">${art}<div class="ep-play">▶</div></div>
    <div><div class="ep-num">Experience ${pad2(i + 1)}</div><div class="ep-title">${esc(pretty(f.name))}</div>
      ${player}
      <a class="ep-dl" href="${esc(f.url)}" download>${vidLabel}${meta ? " · " + meta : ""}</a>${audioDl}</div>
  </div>`;
}
function docRow(f) {
  const meta = fmtSize(f.sizeMB) || "PDF";
  return `<div class="doc-row"><span class="nm">${esc(pretty(f.name))}</span><a href="${esc(f.url)}" download>↓ ${meta}</a></div>`;
}

function render(data) {
  COURSE_TILES = data.tiles && data.tiles.length ? data.tiles : null;
  const files = data.files || [];
  const media = files.filter((f) => f.type === "video" || f.type === "audio");
  const docs = files.filter((f) => f.type === "doc");
  const n = media.length, noun = NOUN(data);
  const isBook = n === 0 && docs.length > 0;   // book/PDF product, not a course

  const emblem = data.cover
    ? `<img class="emblem-img" src="${esc(data.cover)}" alt="">`
    : `<div class="course-emblem">○</div>`;

  let html = `<div class="course-hero">
    ${emblem}
    <h1 class="course-title">${esc(data.title)}</h1>
    <p class="course-welcome">${isBook
      ? "Your copy — yours to keep. Download it below in whichever format you like, and come back any time."
      : `Welcome in. Everything here is yours to experience — stream it right from this page, or download any ${noun}. Take your time. There is no finish line — only now.`}</p>
    ${isBook ? "" : `<div class="course-stats">${n} ${n === 1 ? "experience" : "experiences"} · stream or download</div>
    <p class="course-live">Every one of these was recorded live — so the energy of each experience is transmitted, exactly as it moved through the room, into the recording.</p>`}
  </div>`;

  html += `<div class="save-bar"><b>💾 This is your private link.</b> Bookmark it — it's how you return any time.
    <input id="acc-link" readonly value="${esc(location.href)}"><button class="copy-btn" id="copy-link">Copy link</button></div>`;

  if (media.length) {
    html += `<h2 class="group-head">The ${noun === "meditation" ? "Meditations" : "Sessions"}</h2>`;
    html += `<div class="ep-list">` + media.map(epRow).join("") + `</div>`;
  }
  if (docs.length) {
    html += `<h2 class="group-head">${isBook ? "Your book" : "Workbooks"}</h2><p class="group-note">${isBook ? "Download in your preferred format — PDF or ePub." : "The written companions — download to keep."}</p>`;
    html += `<div class="doc-list">` + docs.map(docRow).join("") + `</div>`;
  }
  html += `<div class="course-foot">Questions? <a href="ask.html">Reach us here.</a> · Tantra Authority</div>`;

  root.innerHTML = html;
  const copyBtn = document.getElementById("copy-link");
  if (copyBtn) copyBtn.addEventListener("click", () => {
    const inp = document.getElementById("acc-link"); inp.select();
    navigator.clipboard.writeText(location.href).then(() => { copyBtn.textContent = "Copied ✓"; setTimeout(() => copyBtn.textContent = "Copy link", 1800); });
  });
  root.querySelectorAll(".ep").forEach((ep) => {
    const art = ep.querySelector(".ep-art"), m = ep.querySelector("audio,video");
    if (!art || !m) return;
    art.addEventListener("click", () => { m.paused ? m.play() : m.pause(); });
    m.addEventListener("play", () => ep.classList.add("playing"));
    m.addEventListener("pause", () => ep.classList.remove("playing"));
  });
}

(async function init() {
  if (!token) { root.innerHTML = `<div class="state-msg">No access token in this link.${recoverBlock("Already purchased? Enter your email and we'll send you back to your experience.")}</div>`; wireRecover(); return; }
  try {
    const r = await fetch(API + "/api/download/" + encodeURIComponent(token));
    const d = await r.json();
    if (r.ok && d.ok) { render(d); return; }
    let intro = "This access link isn't valid.";
    if (d.error === "access_expired") intro = "This access link has expired.";
    root.innerHTML = `<div class="state-msg">${intro}${recoverBlock("Already purchased? Enter your email to get a fresh link.")}</div>`; wireRecover();
  } catch { root.innerHTML = `<div class="state-msg">Couldn't load your course. Refresh to try again.${recoverBlock("Already purchased? Enter your email to recover your link.")}</div>`; wireRecover(); }
})();
</script>
</body>
</html>
